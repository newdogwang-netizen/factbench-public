body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
     background:var(--surface-1);color:var(--text-primary);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:22px;margin:8px 0}
h2{font-size:16px;margin:28px 0 6px}
.sub{color:var(--text-secondary);font-size:13.5px;max-width:64em}
.controls{display:flex;gap:8px;align-items:center}
select,button{background:var(--surface-2);color:var(--text-primary);
  border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .v{font-size:24px;font-weight:700}
.tile .k{font-size:12px;color:var(--text-secondary)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
th{color:var(--text-secondary);font-weight:600;font-size:12px}
td.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted);font-size:12px}
.explain{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:13.5px;margin:10px 0}
.explain b{display:block;margin-bottom:4px}
svg text{fill:var(--text-secondary);font-size:11px}
.tooltip{position:fixed;pointer-events:none;background:var(--surface-2);
  border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);display:none;z-index:9}
footer{margin-top:36px;color:var(--text-muted);font-size:12px}
a{color:var(--series-1)}
</style>

const tt = document.getElementById("tt");
function showTT(e, html){ tt.innerHTML=html; tt.style.display="block";
  tt.style.left=Math.min(e.clientX+12, innerWidth-220)+"px"; tt.style.top=(e.clientY+12)+"px"; }
function hideTT(){ tt.style.display="none"; }

let DATA = {entries:[]};
async function load(){
  try{ DATA = await (await fetch("data/index.json",{cache:"no-store"})).json(); }
  catch(e){ DATA = {entries:[]}; }
  render();
}

function latestPerModel(){
  const m = new Map();
  for(const e of DATA.entries){ // entries are append-only, later wins
    m.set(e.label, e);
  }
  return [...m.values()].sort((a,b)=>b.mean_coverage-a.mean_coverage);
}

function render(){
  // language selector
  const sel = document.getElementById("lang");
  sel.innerHTML = Object.entries(I18N).map(([k,v])=>
    `<option value="${k}" ${k===LANG?"selected":""}>${v._name}</option>`).join("");
  sel.onchange = ()=>{ LANG=sel.value; localStorage.setItem("fb_lang",LANG); render(); };
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach(el=> el.textContent = t(el.dataset.i));
  document.title = t("title");

  const latest = latestPerModel();
  // tiles
  const proto = latest[0] ? latest[0].protocol : "detfact-v2.0";
  const tiles = [
    [latest[0]?latest[0].tasks:25, t("tile_tasks")],
    [DATA.entries.length, t("tile_runs")],
    [latest.length, t("tile_models")],
    [proto, t("tile_proto")],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([v,k])=>
    `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");

  renderBoard(latest);
  renderTable(latest);
  renderTrend();
  document.getElementById("stamp").textContent =
    DATA.entries.length ? "latest: " + DATA.entries[DATA.entries.length-1].date : "";
}

/* ---------- bar board with CI whiskers (single-hue: entity id lives on the label) ---------- */
function renderBoard(latest){
  const el = document.getElementById("board");
  if(!latest.length){ el.innerHTML = `<p class="muted">${t("empty")}</p>`; return; }
  const W=860, rowH=34, padL=190, padR=60, H=latest.length*rowH+18;
  const x = v => padL + v*(W-padL-padR);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  for(const g of [0,.25,.5,.75,1])
    s += `<line x1="${x(g)}" y1="6" x2="${x(g)}" y2="${H-12}" stroke="var(--line)" stroke-width="1"/>
          <text x="${x(g)}" y="${H-1}" text-anchor="middle">${g*100}%</text>`;
  latest.forEach((e,i)=>{
    const y = 10+i*rowH, bw = Math.max(2, x(e.mean_coverage)-x(0));
    s += `<text x="${padL-8}" y="${y+13}" text-anchor="end" style="fill:var(--text-primary);font-size:12px">${e.label}</text>`;
    s += `<rect class="bar" data-i="${i}" x="${x(0)}" y="${y}" width="${bw}" height="18" rx="4"
           fill="var(--series-1)"/>`;
    if(e.coverage_ci95){
      const [lo,hi]=e.coverage_ci95;
      s += `<line x1="${x(lo)}" x2="${x(hi)}" y1="${y+9}" y2="${y+9}" stroke="var(--text-secondary)" stroke-width="2"/>
            <line x1="${x(lo)}" x2="${x(lo)}" y1="${y+4}" y2="${y+14}" stroke="var(--text-secondary)" stroke-width="2"/>
            <line x1="${x(hi)}" x2="${x(hi)}" y1="${y+4}" y2="${y+14}" stroke="var(--text-secondary)" stroke-width="2"/>`;
    }
    const lblX = x(e.coverage_ci95 ? Math.max(e.mean_coverage, e.coverage_ci95[1]) : e.mean_coverage) + 8;
    s += `<text x="${lblX}" y="${y+13}" style="fill:var(--text-primary);font-weight:600">${Math.round(e.mean_coverage*100)}%</text>`;
  });
  s += "</svg>";
  el.innerHTML = s;
  el.querySelectorAll(".bar").forEach(r=>{
    const e = latest[+r.dataset.i];
    r.addEventListener("mousemove",ev=>showTT(ev,
      `<b>${e.label}</b> · ${e.date}<br>${t("t_cov")}: ${Math.round(e.mean_coverage*100)}%`+
      (e.coverage_ci95?` (${Math.round(e.coverage_ci95[0]*100)}–${Math.round(e.coverage_ci95[1]*100)}%)`:``)+
      `<br>${t("t_pass")}: ${DATA.entries.find(x=>x===e)? e.tasks:""}${e.tasks?` · `:``}${t("t_crit")}: ${e.critical_wrong}`));
    r.addEventListener("mouseleave",hideTT);
  });
}

function renderTable(latest){
  const el = document.getElementById("board_table");
  if(!latest.length){ el.innerHTML=""; return; }
  el.innerHTML = `<table><thead><tr>
    <th>${t("t_model")}</th><th>${t("t_date")}</th>
    <th>${t("t_disp")}</th><th>${t("t_crit")}</th><th>${t("t_cov")}</th><th>${t("t_ci")}</th>
    <th>${t("t_pass")}</th><th>${t("t_safety")}</th><th>${t("t_note")}</th>
    </tr></thead><tbody>`+
    latest.map(e=>`<tr><td>${e.label}</td><td class="num">${e.date}</td>
      <td class="num">${e.frame_disputes==null?"—":`${e.frame_disputes}${e.adjudicated_crit!=null?` (${e.adjudicated_crit})`:""}`}</td>
      <td class="num">${e.critical_wrong}${(e.crit_kind||"").startsWith("confirmed")||e.crit_kind==="calibrated"?" ✓":""} <span class="muted">${e.crit_kind==="calibrated"?t("crit_cal"):(e.crit_kind||"").startsWith("confirmed")?t("crit_conf"):t("crit_raw")}</span></td>
      <td class="num">${(e.mean_coverage*100).toFixed(1)}%</td>
      <td class="num">${e.coverage_ci95?`${(e.coverage_ci95[0]*100).toFixed(0)}–${(e.coverage_ci95[1]*100).toFixed(0)}%`:"—"}</td>
      <td class="num">${Math.round(e.pass_rate*e.tasks)}/${e.tasks}</td>
      <td class="num">${e.safety_flags||0}</td>
      <td class="muted">${e.note||""}</td></tr>`).join("")+`</tbody></table>`;
}

/* ---------- history trend (multi-run models; fixed slot order, direct end labels) ---------- */
function renderTrend(){
  const el = document.getElementById("trend");
  const byModel = new Map();
  for(const e of DATA.entries){
    if(!byModel.has(e.label)) byModel.set(e.label,[]);
    byModel.get(e.label).push(e);
  }
  const multi = [...byModel.entries()].filter(([,v])=>v.length>1).slice(0,5);
  if(!multi.length){ el.innerHTML=`<p class="muted">${t("empty")}</p>`; return; }
  const dates = [...new Set(DATA.entries.map(e=>e.date))].sort();
  const W=860,H=240,padL=48,padR=130,padT=12,padB=26;
  const x = d => padL + dates.indexOf(d)/(Math.max(1,dates.length-1))*(W-padL-padR);
  const y = v => padT + (1-v)*(H-padT-padB);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  for(const g of [0,.25,.5,.75,1])
    s += `<line x1="${padL}" x2="${W-padR}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/>
          <text x="${padL-6}" y="${y(g)+4}" text-anchor="end">${g*100}%</text>`;
  dates.forEach(d=> s += `<text x="${x(d)}" y="${H-8}" text-anchor="middle">${d.slice(5)}</text>`);
  multi.forEach(([label,runs],i)=>{
    const col = `var(${SERIES[i%SERIES.length]})`;
    const pts = runs.map(r=>[x(r.date),y(r.mean_coverage)]);
    s += `<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="2"/>`;
    pts.forEach(p=> s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>`);
    const last = pts[pts.length-1];
    s += `<text x="${last[0]+8}" y="${last[1]+4}" style="fill:var(--text-primary);font-size:12px">${label}</text>`;
  });
  s += "</svg>";
  el.innerHTML = s;
}

document.getElementById("lang").addEventListener("change",()=>{});
load();
</script>
</body>
</html>

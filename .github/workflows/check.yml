name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: oracle-passes / no-op-fails on every task
        run: python3 scripts/check_tasks.py

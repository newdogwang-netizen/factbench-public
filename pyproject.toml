[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factbench-scorer"
version = "1.0.0"
description = "Deterministic factual-consistency scorer for clinical note generation (FactBench)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Heidi Health"}]
keywords = ["benchmark", "clinical-notes", "factual-consistency", "llm-evaluation"]

[project.urls]
Homepage = "https://github.com/newdogwang-netizen/factbench-public"
Repository = "https://github.com/newdogwang-netizen/factbench-public"
Issues = "https://github.com/newdogwang-netizen/factbench-public/issues"
Changelog = "https://github.com/newdogwang-netizen/factbench-public/releases"

[tool.setuptools]
package-dir = {"" = "scorer"}
py-modules = ["detfact_scorer", "detfact_consensus", "detfact_factset", "detfact_oracle"]

[tool.setuptools.packages.find]
where = ["scorer"]
include = ["detfact*"]
